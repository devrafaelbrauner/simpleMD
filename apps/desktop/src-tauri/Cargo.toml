[package]
name = "simplemd"
version = "0.0.0"
description = "simpleMD — editor de markdown"
authors = ["Rafael Brauner"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "simplemd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Diálogo só pela API Rust; arquivos pelo gateway do vault (notify = observação). Sem plugin fs
# registrado (AS-02), sem shell, process nem opener (R-2.11, NFR-15).
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
notify-debouncer-full = "0.6"
percent-encoding = "2"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
