[package]
name = "simplemd"
version = "0.1.0"
description = "simpleMD — editor de markdown"
authors = ["Rafael Brauner"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "simplemd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Diálogo só pela API Rust; arquivos pelo gateway do vault (notify = observação). Sem plugin fs
# registrado (AS-02), sem shell nem process; opener só pela função Rust (D-28).
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
notify-debouncer-full = "0.6"
percent-encoding = "2"
getrandom = "0.3"
# IA nativa (arch-backend r2 §1.7): HTTP só no Rust (TLS do sistema, sem proxy, sem HTTP/2), chaves
# só no keychain do sistema (D-20, D-21, R-11.4), zeradas na memória depois do uso.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
zeroize = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync"] }
parking_lot = "0.12"
# `open_url` (r7 R-X7.6, D-R7-B05): só a função livre `tauri_plugin_opener::open_url` no Rust; o
# plugin NUNCA é registrado (0 comandos `plugin:opener|*`) e o pacote JS continua proibido (D-28).
tauri-plugin-opener = "2.7"
# Parse/re-serialização das URLs do `open_url` e corpo de formulário do LanguageTool (já transitiva).
url = "2.5"
# Corpo do pedido ao LanguageTool sem cópia por tentativa (F-10); já vinha no lock por reqwest/tokio.
bytes = "1"

# `O_NOFOLLOW`/`ELOOP` na abertura dos arquivos do vault (CR2-04); já vinha no lock por dependências.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Todas já vinham no lock por tauri/wry/keyring (só arestas novas). WebView sem WebRTC nem preconnect
# (B-06, `webview_net`) e `has_key` só por atributos do keychain (B-01, `ai::keys`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKPreferences", "WKWebViewConfiguration"] }
security-framework = "3"

# Só testes do LanguageTool: porta de loopback reservada sem `listen` (sempre recusa; nenhum teste em
# paralelo a pega). Já vinha no lock por tokio/hyper-util (só aresta nova).
[dev-dependencies]
socket2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
