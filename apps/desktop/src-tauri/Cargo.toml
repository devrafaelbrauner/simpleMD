[package]
name = "simplemd"
version = "0.1.2"
description = "simpleMD — editor de markdown"
authors = ["Rafael Brauner"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "simplemd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Diálogo só pela API Rust; arquivos pelo gateway do vault (notify = observação). Sem plugin fs
# registrado (AS-02), sem shell nem process; opener só pela função Rust (D-28).
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
notify-debouncer-full = "0.6"
percent-encoding = "2"
getrandom = "0.3"
# sha256 da gravação condicional do vault (r26, D-R26-2); já vinha no lock por tauri-codegen (só
# aresta nova).
sha2 = "0.10"
# IA nativa (arch-backend r2 §1.7): HTTP só no Rust (TLS do sistema, sem proxy, sem HTTP/2), chaves
# só no keychain do sistema (D-20, D-21, R-11.4), zeradas na memória depois do uso.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
zeroize = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync"] }
parking_lot = "0.12"
# `open_url` (r7 R-X7.6, D-R7-B05): só a função livre `tauri_plugin_opener::open_url` no Rust; o
# plugin NUNCA é registrado (0 comandos `plugin:opener|*`) e o pacote JS continua proibido (D-28).
tauri-plugin-opener = "2.7"
# Parse/re-serialização das URLs do `open_url` e corpo de formulário do LanguageTool (já transitiva).
url = "2.5"
# Corpo do pedido ao LanguageTool sem cópia por tentativa (F-10); já vinha no lock por reqwest/tokio.
bytes = "1"
# Busca no texto (r37b, design-r37 §1): a dobra por ponto de código do motor TS — NFD e a categoria
# `\p{M}` — e o `Default_Ignorable_Code_Point` da política de nomes (review r36a NB3). Só os dados
# compilados, sem as features padrão (o `utf16_iter` não está no lock); as duas já vinham no lock
# por url/idna (só arestas novas).
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }

# `O_NOFOLLOW`/`ELOOP` na abertura dos arquivos do vault (CR2-04); já vinha no lock por dependências.
# A busca no texto (r37b) percorre por descritor (`openat`, listagem pelo próprio descritor) com o
# `rustix`, sem `unsafe` próprio; já vinha no lock por tempfile/polling (só aresta nova).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

# A busca no texto (r37b) no Windows abre cada item pelo handle da pasta-mãe (`NtOpenFile` com
# `RootDirectory`) e lista pelo próprio handle; já vinha no lock por várias dependências (só aresta
# nova).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

# Todas já vinham no lock por tauri/wry/keyring (só arestas novas). WebView sem WebRTC nem preconnect
# (B-06, `webview_net`) e `has_key` só por atributos do keychain (B-01, `ai::keys`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKPreferences", "WKWebViewConfiguration"] }
security-framework = "3"

# Só testes do LanguageTool: porta de loopback reservada sem `listen` (sempre recusa; nenhum teste em
# paralelo a pega). Já vinha no lock por tokio/hyper-util (só aresta nova).
[dev-dependencies]
socket2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
