packages:
  - apps/*
  - packages/*

# AS-06: política de cadeia de suprimentos do pnpm. O pnpm 12 confere também o lockfile no
# `--frozen-lockfile` do CI. Versão publicada há menos de 1 dia (1440 min) não é instalada.
# 1440 e não os 10080 (7 dias) da regra do Semgrep: hoje 97 entradas do lockfile têm menos de
# 7 dias (a mais nova é de 2026-10-05) e 10080 quebraria a instalação. Subir para 10080 a partir
# de 2026-10-13 (MELHORIAS.md, AS-06).
# nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
minimumReleaseAge: 1440
# Recusa versão com nível de confiança menor (proveniência/publicação confiável) que versões
# anteriores do mesmo pacote: sinal de pacote tomado.
trustPolicy: no-downgrade
# Exceções revisadas (etapa 12a): versões de manutenção oficiais publicadas sem proveniência
# depois de linhas mais novas que a têm; só de desenvolvimento (semver ← @babel/core ←
# eslint-plugin-react-hooks; undici-types ← @types/node).
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0
# Dependências transitivas não podem vir de git/tarball/URL, só do registro.
blockExoticSubdeps: true
# APPSEC-R2-06 / B-12 (r3): o mermaid 12.1.0 pede katex ^0.16.47 (GHSA-238p-pmpm-9mq7, corrigido
# no 0.18.2); força a mesma versão que o app já usa direto.
overrides:
  mermaid>katex: 0.19.0
  # r7 S0 (NFR-58, `pnpm audit --prod`): o md-advanced-tables 3.11.0 fixa lodash 4.17.21
  # (GHSA-r5fr-rjxr-66jc, alta; corrigido no 4.18.1) e o micromark-extension-math do markdownlint
  # pede katex ^0.16 (prototype pollution, corrigido no 0.18.2; o lint só usa a sintaxe): mesmas
  # versões corrigidas, uma cópia de katex no app.
  '@tgrosinger/md-advanced-tables>lodash': 4.18.1
  micromark-extension-math>katex: 0.19.0
