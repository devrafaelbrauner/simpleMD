# B-08 (DO-3): semanal, minor+patch agrupados por ecossistema; merge só pelos 10 checks obrigatórios
# (sem auto-merge). cooldown de 7 dias ≥ minimumReleaseAge do pnpm (1440 min; 10080 com B-09).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # Major fora das atualizações (r3: PRs #5–#8 fechados). O ignore vale também para os PRs de
    # segurança: correção que exija major pode não vir em PR automático; os alertas do Dependabot
    # e o osv-scanner (job audit) seguem acusando.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
