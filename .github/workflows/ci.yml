name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # NFR-17 pede ≤ 10 min; este é só um teto de segurança
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # versão lida de "packageManager" no package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:security # AC-2.18: sem escopo estático de fs, sem shell/process, CSP não nula

  test:
    strategy:
      fail-fast: false # uma perna vermelha no Windows não pode esconder macOS/Ubuntu
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.os != 'ubuntu-latest'
        run: pnpm test
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage # mesma suíte + limites de cobertura v8 (NFR-16)

  # R-2.13 / AC-2.21 (W2): compila o app Tauri em macOS e Windows. Sem empacotar (bundle na
  # etapa 13). Em seguida prova que o harness em memória não entrou no build (R-2.12) e roda os
  # testes Rust do gateway do vault (AC-P.5; `generate_context!` precisa do `dist` do build).
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # NFR-17 pede ≤ 30 min; teto de segurança
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simplemd/desktop tauri build --no-bundle
      - run: node scripts/assert-no-harness.mjs apps/desktop/dist
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
