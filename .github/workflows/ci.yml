name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Cadeia de suprimentos (etapa 12a; `pnpm check:security` confere tudo isto):
# - toda ação fixada pelo SHA de 40 caracteres do commit, com a versão no comentário (AS-05,
#   Secrets F-2); imagens de contêiner fixadas pelo digest sha256;
# - todo checkout com `persist-credentials: false`: nenhum job usa git autenticado (Secrets F-3);
# - Node de `.node-version` e Rust de `rust-toolchain.toml` (DO-1);
# - binários e regras baixados (gitleaks, trufflehog, cargo-audit, osv-scanner, regras do Semgrep)
#   fixados por versão/commit e sha256 conferido antes do uso, um `sha256sum` por download.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # NFR-17 pede ≤ 10 min; este é só um teto de segurança
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (versão do pnpm lida de "packageManager")
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # AC-2.18: sem escopo estático de fs, sem shell/process, CSP não nula; AC-12.8: CI fixado.
      - run: pnpm check:security

  test:
    strategy:
      fail-fast: false # uma perna vermelha no Windows não pode esconder macOS/Ubuntu
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.os != 'ubuntu-latest'
        run: pnpm test
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage # mesma suíte + limites de cobertura v8 (NFR-16)

  # R-2.13 / AC-2.21 (W2): compila o app Tauri em macOS e Windows. Sem empacotar (bundle na
  # etapa 13). Em seguida prova que o harness em memória não entrou no build (R-2.12) e roda os
  # testes Rust do gateway do vault (AC-P.5; `generate_context!` precisa do `dist` do build).
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45 # NFR-17 pede ≤ 30 min; teto de segurança
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # DO-1: o rustup do runner instala a versão de rust-toolchain.toml (sem ação de terceiros).
      - run: rustup toolchain install
      - run: rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simplemd/desktop tauri build --no-bundle
      - run: node scripts/assert-no-harness.mjs apps/desktop/dist
      # AC-11.17: o gravador de fixtures de IA (só debug) não está no binário de release.
      - run: node scripts/assert-no-ai-recorder.mjs
      - if: matrix.os != 'windows-latest'
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      # AC-11.5 / B-11: set/has/delete no Credential Manager real do Windows (serviço de teste
      # aleatório, apagado no fim). O teste é #[ignore] (no macOS o keychain pode estar trancado,
      # R-E4, e aparece como `ignored`); só aqui ele roda, visível (--include-ignored --nocapture).
      - if: matrix.os == 'windows-latest'
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- --include-ignored --nocapture
        env:
          SIMPLEMD_KEYRING_TEST: '1'
      # DO-2 / B-07: proveniência do build do CI (binário + digest do dist + SHA256SUMS), só de
      # pernas verdes (depois dos testes).
      - name: Proveniência (binário, digest do dist, SHA256SUMS)
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop"; mkdir -p "$out"
          bin=simplemd; [ "$RUNNER_OS" = Windows ] && bin=simplemd.exe
          cp "apps/desktop/src-tauri/target/release/$bin" "$out/"
          (cd apps/desktop/dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256) > "$out/dist-files.sha256"
          echo "$(shasum -a 256 < "$out/dist-files.sha256" | cut -d' ' -f1)  apps/desktop/dist ($(wc -l < "$out/dist-files.sha256" | tr -d ' ') files)" > "$out/dist-digest.txt"
          (cd "$out" && shasum -a 256 "$bin" dist-digest.txt dist-files.sha256 > SHA256SUMS && cat SHA256SUMS dist-digest.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os == 'windows-latest' && 'windows' || 'macos' }}
          path: ${{ runner.temp }}/desktop/
          retention-days: 30
          if-no-files-found: error

  # AC-10.8 (critério 4 no motor do WebView2, só CI; product §4.4 P3): o HTML exportado de
  # export-fixture.md pelo código de produção (harness) é impresso pelo Edge (Chromium do WebView2)
  # em PDF A4; a camada de texto precisa ter a célula da tabela, o `5` do calc e os rótulos do
  # Mermaid. PDF + sha256 como artefato. A impressão dentro do app no WebView2 segue NÃO TESTADA.
  export-pdf-windows:
    runs-on: windows-latest
    timeout-minutes: 15 # NFR-40 pede ≤ 10 min; teto de segurança
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simplemd/desktop build:harness
      - run: pnpm exec playwright test --config apps/desktop/playwright.ci.config.ts
        env:
          SIMPLEMD_PDF_CHANNEL: msedge
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: export-pdf-windows
          path: |
            build/export-pdf/export.pdf
            build/export-pdf/export.pdf.sha256
            build/export-pdf/export.pdf.txt
            build/export-pdf/export.html
            build/export-pdf/export-print-media.png
          if-no-files-found: error

  # Secrets F-1: varredura de segredos no histórico inteiro (todos os commits, push e PR). Falha
  # com qualquer achado; `.gitleaksignore` (na raiz) lista só falsos positivos revisados.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      TRUFFLEHOG_VERSION: 3.97.9
      TRUFFLEHOG_SHA256: 40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instala o gitleaks (versão e sha256 fixados)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1'
      # B-05 (F-7): segunda varredura, só segredos verificados no provedor. `--no-update` impede o
      # trufflehog de se atualizar sozinho por fora da versão fixada.
      - name: Instala o trufflehog (versão e sha256 fixados)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trufflehog.tar.gz" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  $RUNNER_TEMP/trufflehog.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$RUNNER_TEMP" trufflehog
      - run: '"$RUNNER_TEMP/trufflehog" git file://. --only-verified --fail --no-update'
        timeout-minutes: 5

  # DO-4 / NFR-15: auditoria de dependências. `pnpm audit` falha com aviso alto ou crítico nas
  # dependências de produção; `cargo-audit` falha com qualquer vulnerabilidade (exceções de aviso
  # documentadas em apps/desktop/src-tauri/.cargo/audit.toml, AS-07).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_AUDIT_VERSION: 0.22.2
      CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
      OSV_SCANNER_VERSION: 2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm audit --prod --audit-level high
      - name: Instala o cargo-audit (versão e sha256 fixados)
        run: |
          name="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/cargo-audit.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${name}.tgz"
          echo "${CARGO_AUDIT_SHA256}  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$RUNNER_TEMP" --strip-components=1 "${name}/cargo-audit"
      - run: '"$RUNNER_TEMP/cargo-audit" audit'
        working-directory: apps/desktop/src-tauri
      # B-05 (F-7): osv-scanner nos dois lockfiles, dev incluído; ignora só os avisos já aceitos
      # (osv-scanner.toml, cada um com motivo e referência).
      - name: Instala o osv-scanner (versão e sha256 fixados)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - run: >-
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml
          --lockfile pnpm-lock.yaml --lockfile apps/desktop/src-tauri/Cargo.lock
        timeout-minutes: 3

  # DO-4 / NFR-15 / B-18 (r3): SAST com regras FIXADAS. Os arquivos de regra listados em
  # .github/semgrep-rules.txt (o conjunto que `auto` + p/typescript, p/react, p/rust, p/secrets
  # rodava) vêm de um commit fixo do semgrep/semgrep-rules, com sha256 conferido, montados como
  # <dir>/<stem>/<arquivo> para os ids ficarem iguais aos do registro (os `nosemgrep` continuam
  # valendo). Falha com qualquer achado (`--error`); exceções só em linha (`nosemgrep`) com
  # justificativa. Regras novas do registro aparecem só no semgrep-latest.yml (não obrigatório).
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    env:
      # semgrep/semgrep-rules (Semgrep Rules License v1.0: só uso interno; baixado no CI, nunca
      # copiado para o repositório).
      SEMGREP_RULES_COMMIT: a84ff9cc2453ca91d581380de4b8b3f272f6f4be
      SEMGREP_RULES_SHA256: b227c2d234ffd9c84c4dbd6619a5897a7192637c141baeace3bfc37b0715a887
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regras fixadas (commit + sha256), na estrutura de ids do registro
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/semgrep-rules.tgz" \
            "https://codeload.github.com/semgrep/semgrep-rules/tar.gz/${SEMGREP_RULES_COMMIT}"
          echo "${SEMGREP_RULES_SHA256}  $RUNNER_TEMP/semgrep-rules.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/semgrep-rules.tgz" -C "$RUNNER_TEMP"
          src="$RUNNER_TEMP/semgrep-rules-${SEMGREP_RULES_COMMIT}"; dst="$RUNNER_TEMP/semgrep-pinned"
          while IFS= read -r rule; do
            case "$rule" in ''|'#'*) continue ;; esac
            test -f "$src/$rule" || { echo "::error::regra fixada ausente: $rule"; exit 1; }
            mkdir -p "$dst/${rule%.*}" && cp "$src/$rule" "$dst/${rule%.*}/"
          done < .github/semgrep-rules.txt
      - run: >-
          semgrep scan --error --metrics=off --config "$RUNNER_TEMP/semgrep-pinned"
          --exclude node_modules --exclude target --exclude .nexus --exclude dist .
