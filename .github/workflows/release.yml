          ## 2. Primeira abertura (só para este arquivo, depois da conferência)

          O passo a passo abaixo vale **só para o simpleMD @V@ baixado desta página e conferido no passo 1**. Não é um jeito geral de abrir apps bloqueados: o aviso do sistema existe para proteger você de apps de origem desconhecida. Não desligue nenhuma proteção do sistema e não use o Terminal para tirar a quarentena; o simpleMD não precisa disso.

          - **macOS:** abra o `.dmg` e, na janela dele, arraste o ícone simpleMD para o atalho "Applications" (é a pasta Aplicativos). Abra o simpleMD em Aplicativos. O macOS mostra "O Item simpleMD Não Foi Aberto", dizendo que a Apple não pôde verificar se o item está livre de malware. Clique em "OK", **não** em "Mover para o Lixo" (é o botão destacado: a tecla Return o aciona). Se a mensagem disser que o app está "danificado", pare: não abra, apague o arquivo e avise (passo 1). Depois abra Ajustes do Sistema → "Privacidade e Segurança" e role até a seção "Segurança", onde aparece "O app simpleMD foi bloqueado para proteger o Mac."; clique em "Abrir Mesmo Assim". Pode aparecer um segundo aviso, "Abrir o Item simpleMD?": clique em "Abrir Mesmo Assim" (de novo **não** em "Mover para o Lixo", que é o botão destacado). Clique em "Abrir Mesmo Assim" uma vez só em cada aviso e confirme com a sua senha ou o Touch ID sem trocar de janela. O app abre. Isso deve se repetir a cada nova versão sem assinatura.
