name: Release
# B-01 (preparo, r3) + B-07 + r5 (pré-lançamento sem assinatura) + r6 (macOS assinado). Gatilhos:
# - workflow_dispatch sem inputs: só `bundle-dry-run` (pacotes sem assinatura de desenvolvedor — o
#   .app do macOS com assinatura ad-hoc —, sem Environment, sem segredos, artefatos de 7 dias; não
#   publica nada). Numa ref de tag, confere antes tag na main e versão;
# - workflow_dispatch com unsigned_prerelease: true, disparado NA tag v* (`gh workflow run
#   release.yml --ref vX.Y.Z -f unsigned_prerelease=true`): o mesmo `bundle-dry-run` e depois
#   `publish-unsigned` no Environment `release` (revisor obrigatório), que cria um release
#   RASCUNHO marcado como pré-lançamento com o .dmg, o -setup.exe, SHA256SUMS e a atestação; o
#   dono publica à mão (r5; inalterado);
# - workflow_dispatch com rehearse_signing: true, NA main (r6, `gh workflow run release.yml --ref
#   main -f rehearse_signing=true`): o caminho assinado menos a publicação — `bundle-macos`,
#   `bundle-windows` e `sign-macos` no Environment `signing-rehearsal` (revisor obrigatório, só a
#   main). O .dmg assinado fica 1 dia como artefato, para a QA; nada é publicado nem atestado;
# - push de tag v* (só o admin cria tag v*, ruleset `v-tags-create-admin-only`): `bundle-macos` e
#   `bundle-windows` (sem segredos, sem Environment), `sign-macos` (Environment `release`: assina,
#   notariza, grampeia e confere o .app e o .dmg num runner limpo que não roda código do projeto)
#   e `publish` (Environment `release`: rascunho de pré-lançamento com o .dmg assinado, o
#   -setup.exe SEM assinatura, SHA256SUMS e a atestação). Sem os segredos, o `sign-macos` falha no
#   PRIMEIRO passo e nada é assinado nem publicado.
# Builds de release sem cache (setup-node sem cache, sem rust-cache): nada de cache entra em
# artefato publicado.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      unsigned_prerelease:
        description: 'Criar rascunho de pré-lançamento sem assinatura (só numa tag v*; Environment release)'
        type: boolean
        default: false
      rehearse_signing:
        description: 'Ensaiar assinatura e notarização do macOS (só na main; Environment signing-rehearsal; não publica)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bundle-dry-run:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # r5 (AS-R5-M01): numa tag (e sempre com unsigned_prerelease) só se empacota commit da main
      # cuja versão é a da tag; unsigned_prerelease fora de uma tag v* para aqui. Antes do
      # install/build.
      - id: unsigned-prerelease-guard
        if: inputs.unsigned_prerelease == true || github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && [[ "$TAG" == v* ]] || { echo "::error::unsigned_prerelease só numa tag v* (ref: $GITHUB_REF)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::o commit da tag não está na main"; exit 1; }
          v=$(node -p "require('./apps/desktop/src-tauri/tauri.release.conf.json').version || require('./apps/desktop/src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml)
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          [ "$TAG" = "v$v" ] && [ "$cargo" = "$v" ] && [ "$pkg" = "$v" ] || { echo "::error::tag $TAG, Cargo.toml $cargo e package.json $pkg têm de ser a versão do app (v$v)"; exit 1; }
      - run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      # C-1: o overlay só liga o bundle (dmg/app, msi/nsis), hardened runtime e entitlements. Build e
      # bundle separados como no bundle-release (APPSEC-R3-01). APPSEC-R3-04: o cargo usa o Cargo.lock
      # do repositório (--locked).
      - run: pnpm --filter @simplemd/desktop tauri build --no-bundle --config src-tauri/tauri.release.conf.json -- --locked
      # r5 (AS-R5-M07): identidade ad-hoc `-` (não é segredo): sem ela o .app baixado aparece
      # "danificado" no Apple Silicon. Só neste passo; o bundle-release nunca usa `-` (check:ci).
      - run: pnpm --filter @simplemd/desktop tauri bundle --config src-tauri/tauri.release.conf.json
        env:
          APPLE_SIGNING_IDENTITY: '-'
      # r5 (AS-R5-M08): a assinatura ad-hoc pegou no .app inteiro (selo válido, identificador do app,
      # hardened runtime); o .app só com a assinatura do linker reprova no --verify --deep --strict.
      - name: Assinatura ad-hoc do .app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=apps/desktop/src-tauri/target/release/bundle/macos/simpleMD.app
          codesign --verify --deep --strict --verbose=2 "$app"
          info=$(codesign -dvvv "$app" 2>&1)
          echo "$info"
          grep -qx 'Signature=adhoc' <<< "$info" || { echo "::error::o .app não tem assinatura ad-hoc"; exit 1; }
          grep -qx 'Identifier=io.github.devrafaelbrauner.simplemd' <<< "$info" || { echo "::error::identificador da assinatura errado"; exit 1; }
          grep -qF '(adhoc,runtime)' <<< "$info" || { echo "::error::assinatura sem hardened runtime"; exit 1; }
      - run: node scripts/assert-no-harness.mjs apps/desktop/dist
      - run: node scripts/assert-no-ai-recorder.mjs
      # r5 (AS-R5-M16): o revisor confere no log o sha256 de cada pacote antes de aprovar a publicação.
      - name: SHA-256 dos pacotes
        shell: bash
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          shopt -s nullglob
          files=(dmg/*.dmg msi/*.msi nsis/*.exe)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::nenhum pacote gerado"; exit 1; }
          node -e "const {createHash} = require('node:crypto'); const {readFileSync} = require('node:fs'); for (const f of process.argv.slice(1)) console.log(createHash('sha256').update(readFileSync(f)).digest('hex') + '  ' + f);" "${files[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-dry-run-${{ matrix.os == 'windows-latest' && 'windows' || 'macos' }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

  # r6 (CR3-S1, AS-R6-M06): o .app do macOS do caminho assinado. Sem Environment, sem segredos, sem
  # matriz (a saída de um job de matriz pode ser sobrescrita por outra perna). Sem identidade: o .app
  # sai só com a assinatura do linker, que o sign-macos substitui. Sobe UM tar (archive: false) e
  # entrega o id e o sha256 dele como saídas do job.
  bundle-macos:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.rehearse_signing == true && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      app-tar-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
      app-tar-sha256: ${{ steps.app-tar.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Só numa tag v* (a da versão do app) ou na main (ensaio); o commit tem de estar na main e as
      # três versões têm de bater. Antes do install/build.
      - id: release-guard
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*|refs/heads/main) ;; *) echo "::error::caminho assinado só numa tag v* ou na main (ref: $GITHUB_REF)"; exit 1;; esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::o commit da tag não está na main"; exit 1; }
          v=$(node -p "require('./apps/desktop/src-tauri/tauri.release.conf.json').version || require('./apps/desktop/src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml)
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          [ "$cargo" = "$v" ] && [ "$pkg" = "$v" ] || { echo "::error::Cargo.toml $cargo e package.json $pkg têm de ser a versão do app ($v)"; exit 1; }
          [ "$GITHUB_REF_TYPE" != tag ] || [ "$TAG" = "v$v" ] || { echo "::error::a tag $TAG não é a versão do app (v$v)"; exit 1; }
      - run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simplemd/desktop tauri build --no-bundle --config src-tauri/tauri.release.conf.json -- --locked
      - run: pnpm --filter @simplemd/desktop tauri bundle --bundles app --config src-tauri/tauri.release.conf.json
      - run: node scripts/assert-no-harness.mjs apps/desktop/dist
      - run: node scripts/assert-no-ai-recorder.mjs
      # AS-R6-F01: a listagem crua (tar:!mac-ext) mostra também membros AppleDouble `._*`.
      - id: app-tar
        name: tar do .app (lista exata) e SHA-256
        shell: bash
        working-directory: apps/desktop/src-tauri/target/release/bundle/macos
        run: |
          COPYFILE_DISABLE=1 /usr/bin/tar --no-mac-metadata --no-xattrs --no-acls --no-fflags -cf "$RUNNER_TEMP/simpleMD.app.tar" simpleMD.app
          printf '%s\n' simpleMD.app/ simpleMD.app/Contents/ simpleMD.app/Contents/Info.plist simpleMD.app/Contents/MacOS/ simpleMD.app/Contents/MacOS/simplemd simpleMD.app/Contents/Resources/ simpleMD.app/Contents/Resources/icon.icns | LC_ALL=C /usr/bin/sort > "$RUNNER_TEMP/esperado"
          /usr/bin/tar --options 'tar:!mac-ext' -tf "$RUNNER_TEMP/simpleMD.app.tar" | LC_ALL=C /usr/bin/sort > "$RUNNER_TEMP/achado"
          /usr/bin/diff -u "$RUNNER_TEMP/esperado" "$RUNNER_TEMP/achado" || { echo "::error::o .app não é exatamente a lista esperada"; exit 1; }
          sha=$(/usr/bin/shasum -a 256 "$RUNNER_TEMP/simpleMD.app.tar" | /usr/bin/awk '{print $1}')
          echo "$sha  simpleMD.app.tar"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - id: upload-app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/simpleMD.app.tar
          archive: false
          retention-days: 1
          if-no-files-found: error

  # r6 (R-03): o instalador do Windows do release, SEM assinatura por decisão do usuário. Sem
  # Environment, sem segredos. "Sem assinatura" é conferido (NotSigned), não suposto: quando houver
  # assinatura do Windows este passo tem de mudar de propósito. Só o NSIS (o .msi não é publicado).
  bundle-windows:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.rehearse_signing == true && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      exe-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
      exe-sha256: ${{ steps.exe.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - id: release-guard
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*|refs/heads/main) ;; *) echo "::error::caminho assinado só numa tag v* ou na main (ref: $GITHUB_REF)"; exit 1;; esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::o commit da tag não está na main"; exit 1; }
          v=$(node -p "require('./apps/desktop/src-tauri/tauri.release.conf.json').version || require('./apps/desktop/src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml)
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          [ "$cargo" = "$v" ] && [ "$pkg" = "$v" ] || { echo "::error::Cargo.toml $cargo e package.json $pkg têm de ser a versão do app ($v)"; exit 1; }
          [ "$GITHUB_REF_TYPE" != tag ] || [ "$TAG" = "v$v" ] || { echo "::error::a tag $TAG não é a versão do app (v$v)"; exit 1; }
      - run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simplemd/desktop tauri build --no-bundle --config src-tauri/tauri.release.conf.json -- --locked
      - run: pnpm --filter @simplemd/desktop tauri bundle --bundles nsis --config src-tauri/tauri.release.conf.json
      - run: node scripts/assert-no-harness.mjs apps/desktop/dist
      - run: node scripts/assert-no-ai-recorder.mjs
      - id: exe
        name: Instalador declarado sem assinatura (NotSigned) e SHA-256
        shell: pwsh
        run: |
          $v = (Get-Content -Raw -LiteralPath apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $name = "simpleMD_${v}_x64-setup.exe"
          $files = @(Get-ChildItem -LiteralPath apps/desktop/src-tauri/target/release/bundle/nsis -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne $name) { Write-Output "::error::bundle/nsis tem de ter só $name"; exit 1 }
          $sig = Get-AuthenticodeSignature -LiteralPath $files[0].FullName
          Write-Output "${name}: $($sig.Status)"
          if ($sig.Status -ne 'NotSigned') { Write-Output "::error::o -setup.exe tem de sair sem assinatura (NotSigned); achado: $($sig.Status)"; exit 1 }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $files[0].FullName).Hash.ToLowerInvariant()
          Write-Output "$sha  $name"
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - id: upload-exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          archive: false
          retention-days: 7
          if-no-files-found: error

  # r6 (CR3-S1, CR3-R1, AS-R5-S08, AS-R6-M01…M15): assina, notariza e grampeia o .app e o .dmg num
  # runner limpo que NÃO faz checkout nem roda código do projeto (node/pnpm/tauri/cargo/scripts):
  # só ferramentas da Apple, por caminho absoluto, no bash do sistema. Segredos só no env dos passos
  # require-signing-secrets e sign. Sem identidade de entrada: a única identidade válida do .p12 tem
  # de ser "Developer ID Application: Rafael Brauner (<Team ID>)" e assina pelo SHA-1 (ad-hoc é
  # impossível). Na tag: Environment release; no ensaio (main): Environment signing-rehearsal.
  sign-macos:
    needs: bundle-macos
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.rehearse_signing == true && github.ref == 'refs/heads/main')
    environment:
      name: ${{ github.event_name == 'push' && 'release' || 'signing-rehearsal' }}
    runs-on: macos-26
    timeout-minutes: 120
    permissions: {}
    outputs:
      signed-dmg-artifact-id: ${{ steps.upload-dmg.outputs.artifact-id }}
      signed-dmg-sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      # 1) Fail-closed: antes de qualquer download, import ou upload. Só presença e formato; nada é
      # decodificado nem impresso.
      - id: require-signing-secrets
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=""
          for n in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY APPLE_TEAM_ID; do
            [ -n "${!n:-}" ] || missing="$missing $n"
          done
          [ -z "$missing" ] || { echo "::error::segredos de assinatura ausentes no Environment:$missing"; exit 1; }
          [ -z "${APPLE_ID:-}${APPLE_PASSWORD:-}" ] || { echo "::error::notarização por Apple ID não é aceita (só a chave de API da App Store Connect)"; exit 1; }
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID com formato inválido"; exit 1; }
          [[ "$APPLE_API_KEY" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_API_KEY com formato inválido"; exit 1; }
          [[ "$APPLE_API_ISSUER" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::APPLE_API_ISSUER com formato inválido"; exit 1; }
          [[ "$APPLE_CERTIFICATE" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || { echo "::error::APPLE_CERTIFICATE tem de ser base64 numa linha só"; exit 1; }
          [[ "$APPLE_API_PRIVATE_KEY" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || { echo "::error::APPLE_API_PRIVATE_KEY tem de ser base64 numa linha só"; exit 1; }
      # 2) Saídas de outro job são dados: formato antes de usar (AS-R6-M09).
      - id: inputs
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          APP_TAR_ID: ${{ needs.bundle-macos.outputs.app-tar-artifact-id }}
          APP_TAR_SHA: ${{ needs.bundle-macos.outputs.app-tar-sha256 }}
        run: |
          [[ "$APP_TAR_ID" =~ ^[0-9]+$ ]] || { echo "::error::app-tar-artifact-id inválido"; exit 1; }
          [[ "$APP_TAR_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::app-tar-sha256 inválido"; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.bundle-macos.outputs.app-tar-artifact-id }}
          path: ${{ runner.temp }}/in
      # 3) Entrada: o tar é o que o bundle-macos produziu, com exatamente os 7 itens, só pastas e
      # arquivos comuns, simplemd 755; extração segura; Info.plist e arquitetura conferidos.
      - id: intake
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          APP_TAR_SHA: ${{ needs.bundle-macos.outputs.app-tar-sha256 }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$APP_TAR_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::app-tar-sha256 inválido"; exit 1; }
          T="$RUNNER_TEMP/in/simpleMD.app.tar"
          [ "$(/usr/bin/find "$RUNNER_TEMP/in" -mindepth 1)" = "$T" ] && [ -f "$T" ] && [ ! -L "$T" ] || { echo "::error::o download não é exatamente simpleMD.app.tar"; exit 1; }
          [ "$(/usr/bin/shasum -a 256 "$T" | /usr/bin/awk '{print $1}')" = "$APP_TAR_SHA" ] || { echo "::error::o tar baixado não é o que o bundle-macos produziu"; exit 1; }
          printf '%s\n' simpleMD.app/ simpleMD.app/Contents/ simpleMD.app/Contents/Info.plist simpleMD.app/Contents/MacOS/ simpleMD.app/Contents/MacOS/simplemd simpleMD.app/Contents/Resources/ simpleMD.app/Contents/Resources/icon.icns | LC_ALL=C /usr/bin/sort > "$RUNNER_TEMP/esperado"
          /usr/bin/tar --options 'tar:!mac-ext' -tf "$T" | LC_ALL=C /usr/bin/sort > "$RUNNER_TEMP/achado"
          /usr/bin/diff -u "$RUNNER_TEMP/esperado" "$RUNNER_TEMP/achado" || { echo "::error::o tar do .app não é exatamente a lista esperada"; exit 1; }
          bad=$(/usr/bin/tar --options 'tar:!mac-ext' -tvf "$T" | /usr/bin/awk '$1 !~ /^(d|-)[rwx-]{9}$/')
          [ -z "$bad" ] || { echo "::error::tipo ou modo proibido no tar"; echo "$bad"; exit 1; }
          /usr/bin/tar --options 'tar:!mac-ext' -tvf "$T" | /usr/bin/awk '$NF=="simpleMD.app/Contents/MacOS/simplemd" && $1!="-rwxr-xr-x"{exit 1}' || { echo "::error::simplemd sem modo 755"; exit 1; }
          /bin/mkdir "$RUNNER_TEMP/app"
          /usr/bin/tar --options 'tar:!mac-ext' --no-xattrs --no-acls --no-fflags --no-mac-metadata --no-same-owner -xf "$T" -C "$RUNNER_TEMP/app"
          /usr/bin/xattr -cr "$RUNNER_TEMP/app/simpleMD.app"
          P="$RUNNER_TEMP/app/simpleMD.app/Contents/Info.plist"
          [ "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$P")" = io.github.devrafaelbrauner.simplemd ] || { echo "::error::CFBundleIdentifier errado"; exit 1; }
          [ "$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$P")" = simplemd ] || { echo "::error::CFBundleExecutable errado"; exit 1; }
          V=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$P")
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versão do app inválida"; exit 1; }
          [ "$GITHUB_REF_TYPE" != tag ] || [ "$TAG" = "v$V" ] || { echo "::error::a tag $TAG não é a versão do .app (v$V)"; exit 1; }
          [ "$(/usr/bin/lipo -archs "$RUNNER_TEMP/app/simpleMD.app/Contents/MacOS/simplemd")" = arm64 ] || { echo "::error::o binário não é só arm64"; exit 1; }
      # 4) O ÚNICO passo, além do 1), com segredos. Keychain temporário com senha aleatória; .p12 e
      # .p8 só em $RUNNER_TEMP, apagados logo após o uso e de novo pelo trap (também em cancelamento).
      - id: sign
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          umask 077
          KC="$RUNNER_TEMP/simplemd-signing.keychain-db"
          cleanup() { /usr/bin/security delete-keychain "$KC" 2>/dev/null || true; /bin/rm -f "$RUNNER_TEMP/devid.p12" "$RUNNER_TEMP/AuthKey.p8"; }
          trap cleanup EXIT INT TERM
          KC_PASS=$(/usr/bin/openssl rand -hex 32)
          echo "::add-mask::$KC_PASS"
          /usr/bin/security create-keychain -p "$KC_PASS" "$KC"
          /usr/bin/security set-keychain-settings -lut 7200 "$KC"
          /usr/bin/security unlock-keychain -p "$KC_PASS" "$KC"
          /usr/bin/base64 --decode <<< "$APPLE_CERTIFICATE" > "$RUNNER_TEMP/devid.p12"
          /usr/bin/security import "$RUNNER_TEMP/devid.p12" -k "$KC" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          /bin/rm -f "$RUNNER_TEMP/devid.p12"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          /usr/bin/security list-keychains -d user -s "$KC" $(/usr/bin/security list-keychains -d user | /usr/bin/tr -d '"')
          ids=$(/usr/bin/security find-identity -v -p codesigning "$KC")
          echo "$ids"
          [ "$(echo "$ids" | /usr/bin/tail -1)" = "     1 valid identities found" ] || { echo "::error::o keychain temporário não tem exatamente 1 identidade válida"; exit 1; }
          echo "$ids" | /usr/bin/grep -qF "\"Developer ID Application: Rafael Brauner ($APPLE_TEAM_ID)\"" || { echo "::error::a identidade não é a Developer ID Application de Rafael Brauner com o Team ID do Environment"; exit 1; }
          SHA1=$(echo "$ids" | /usr/bin/awk 'NR==1{print $2}')
          [[ "$SHA1" =~ ^[0-9A-F]{40}$ ]] || { echo "::error::identidade sem SHA-1"; exit 1; }
          /usr/bin/base64 --decode <<< "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          /usr/bin/xcrun notarytool store-credentials simplemd-notary --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --keychain "$KC"
          /bin/rm -f "$RUNNER_TEMP/AuthKey.p8"
          notarize() {
            local file="$1" what="$2" rc=0 sub
            /usr/bin/shasum -a 256 "$file" | /usr/bin/awk '{print $1}' > "$RUNNER_TEMP/notary-$what.sha256"
            /usr/bin/xcrun notarytool submit "$file" --keychain-profile simplemd-notary --keychain "$KC" --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notary-$what.json" || rc=$?
            /bin/cat "$RUNNER_TEMP/notary-$what.json"
            sub=$(/usr/bin/plutil -extract id raw -o - "$RUNNER_TEMP/notary-$what.json")
            /usr/bin/xcrun notarytool log "$sub" --keychain-profile simplemd-notary --keychain "$KC" "$RUNNER_TEMP/notary-$what-log.json"
            /bin/cat "$RUNNER_TEMP/notary-$what-log.json"
            [ "$rc" = 0 ] && [ "$(/usr/bin/plutil -extract status raw -o - "$RUNNER_TEMP/notary-$what.json")" = Accepted ] || { echo "::error::notarização ($what) não aceita"; exit 1; }
          }
          APP="$RUNNER_TEMP/app/simpleMD.app"
          V=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versão do app inválida"; exit 1; }
          /usr/bin/codesign --force --options runtime --timestamp --keychain "$KC" --sign "$SHA1" "$APP"
          /usr/bin/ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/simpleMD.app.zip"
          notarize "$RUNNER_TEMP/simpleMD.app.zip" app
          /usr/bin/xcrun stapler staple "$APP"
          /bin/mkdir "$RUNNER_TEMP/stage" "$RUNNER_TEMP/out"
          /usr/bin/ditto "$APP" "$RUNNER_TEMP/stage/simpleMD.app"
          /bin/ln -s /Applications "$RUNNER_TEMP/stage/Applications"
          DMG="$RUNNER_TEMP/out/simpleMD_${V}_aarch64.dmg"
          /usr/bin/hdiutil create -volname simpleMD -srcfolder "$RUNNER_TEMP/stage" -fs HFS+ -format UDZO -ov "$DMG"
          /usr/bin/hdiutil verify "$DMG"
          /usr/bin/codesign --force --timestamp --keychain "$KC" --sign "$SHA1" --identifier io.github.devrafaelbrauner.simplemd.dmg "$DMG"
          notarize "$DMG" dmg
          /usr/bin/xcrun stapler staple "$DMG"
      # 5) CR3-R1 + S08, sem segredos, antes do único upload: assinatura, cadeia, Team ID, runtime,
      # carimbo de tempo, requisito designado sem cdhash, notarização, grampo, Gatekeeper e limpeza.
      - id: verify
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          [ ! -e "$RUNNER_TEMP/simplemd-signing.keychain-db" ] && [ ! -e "$RUNNER_TEMP/devid.p12" ] && [ ! -e "$RUNNER_TEMP/AuthKey.p8" ] || { echo "::error::keychain ou chaves temporárias não foram apagados"; exit 1; }
          if /usr/bin/security list-keychains -d user | /usr/bin/grep -qF simplemd-signing; then echo "::error::keychain temporário ainda na lista de busca"; exit 1; fi
          ID="Developer ID Application: Rafael Brauner ($APPLE_TEAM_ID)"
          V=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$RUNNER_TEMP/app/simpleMD.app/Contents/Info.plist")
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versão do app inválida"; exit 1; }
          DMG="$RUNNER_TEMP/out/simpleMD_${V}_aarch64.dmg"
          [ "$(/usr/bin/find "$RUNNER_TEMP/out" -mindepth 1)" = "$DMG" ] || { echo "::error::a pasta de saída tem de ter só o .dmg"; exit 1; }
          for w in app dmg; do
            /usr/bin/grep -Eq "\"sha256\" *: *\"$(/bin/cat "$RUNNER_TEMP/notary-$w.sha256")\"" "$RUNNER_TEMP/notary-$w-log.json" || { echo "::error::o log da notarização ($w) não é do arquivo enviado"; exit 1; }
            /usr/bin/grep -Eq '"status" *: *"Accepted"' "$RUNNER_TEMP/notary-$w-log.json" || { echo "::error::log da notarização ($w) sem status Accepted"; exit 1; }
          done
          /usr/bin/hdiutil verify "$DMG"
          /usr/bin/codesign --verify --strict --verbose=2 "$DMG"
          dinfo=$(/usr/bin/codesign -dvvv "$DMG" 2>&1)
          echo "$dinfo"
          for l in "Authority=$ID" 'Authority=Developer ID Certification Authority' 'Authority=Apple Root CA' "TeamIdentifier=$APPLE_TEAM_ID"; do /usr/bin/grep -qxF "$l" <<< "$dinfo" || { echo "::error::assinatura do .dmg sem a linha: $l"; exit 1; }; done
          /usr/bin/grep -q '^Timestamp=' <<< "$dinfo" || { echo "::error::.dmg sem carimbo de tempo seguro"; exit 1; }
          /usr/bin/xcrun stapler validate "$DMG"
          dspctl=$(/usr/sbin/spctl --assess --type open --context context:primary-signature -vvv "$DMG" 2>&1)
          echo "$dspctl"
          /usr/bin/grep -qF ': accepted' <<< "$dspctl" && /usr/bin/grep -qxF 'source=Notarized Developer ID' <<< "$dspctl" || { echo "::error::o Gatekeeper não aceita o .dmg como Notarized Developer ID"; exit 1; }
          M="$RUNNER_TEMP/verify-mnt"
          /usr/bin/hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$M" "$DMG" > /dev/null
          printf '%s\n' "$M/Applications" "$M/simpleMD.app" > "$RUNNER_TEMP/topo-esperado"
          /usr/bin/find "$M" -mindepth 1 -maxdepth 1 | LC_ALL=C /usr/bin/sort > "$RUNNER_TEMP/topo-achado"
          /usr/bin/diff -u "$RUNNER_TEMP/topo-esperado" "$RUNNER_TEMP/topo-achado" || { echo "::error::o .dmg não tem exatamente Applications e simpleMD.app"; exit 1; }
          [ -L "$M/Applications" ] && [ "$(/usr/bin/readlink "$M/Applications")" = /Applications ] || { echo "::error::Applications não é o atalho para /Applications"; exit 1; }
          A="$M/simpleMD.app"
          (cd "$M" && /usr/bin/find simpleMD.app | LC_ALL=C /usr/bin/sort) > "$RUNNER_TEMP/app-achado"
          printf '%s\n' simpleMD.app simpleMD.app/Contents simpleMD.app/Contents/CodeResources simpleMD.app/Contents/Info.plist simpleMD.app/Contents/MacOS simpleMD.app/Contents/MacOS/simplemd simpleMD.app/Contents/Resources simpleMD.app/Contents/Resources/icon.icns simpleMD.app/Contents/_CodeSignature simpleMD.app/Contents/_CodeSignature/CodeResources | LC_ALL=C /usr/bin/sort > "$RUNNER_TEMP/app-esperado"
          /usr/bin/diff -u "$RUNNER_TEMP/app-esperado" "$RUNNER_TEMP/app-achado" || { echo "::error::o .app do .dmg não tem exatamente os arquivos esperados"; exit 1; }
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$A"
          info=$(/usr/bin/codesign -dvvv "$A" 2>&1)
          echo "$info"
          for l in 'Identifier=io.github.devrafaelbrauner.simplemd' "Authority=$ID" 'Authority=Developer ID Certification Authority' 'Authority=Apple Root CA' "TeamIdentifier=$APPLE_TEAM_ID"; do /usr/bin/grep -qxF "$l" <<< "$info" || { echo "::error::assinatura do .app sem a linha: $l"; exit 1; }; done
          /usr/bin/grep -q '^Timestamp=' <<< "$info" || { echo "::error::.app sem carimbo de tempo seguro"; exit 1; }
          /usr/bin/grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\(runtime\)' <<< "$info" || { echo "::error::.app sem hardened runtime"; exit 1; }
          if /usr/bin/grep -Eq 'adhoc|^Signed Time=' <<< "$info"; then echo "::error::assinatura ad-hoc ou sem carimbo de tempo seguro"; exit 1; fi
          ent=$(/usr/bin/codesign -d --entitlements - --xml "$A" 2>/dev/null)
          [ -z "$ent" ] || [ "$(/usr/bin/plutil -convert json -o - - <<< "$ent")" = '{}' ] || { echo "::error::o .app assinado tem entitlements"; exit 1; }
          req=$(/usr/bin/codesign -d -r- "$A" 2>&1)
          echo "$req"
          /usr/bin/grep -qF 'designated => identifier "io.github.devrafaelbrauner.simplemd" and anchor apple generic' <<< "$req" && /usr/bin/grep -qF 'certificate leaf[subject.OU] = ' <<< "$req" && /usr/bin/grep -qF "$APPLE_TEAM_ID" <<< "$req" || { echo "::error::requisito designado não é o do Developer ID (identificador + Team ID)"; exit 1; }
          if /usr/bin/grep -q cdhash <<< "$req"; then echo "::error::requisito designado preso a um cdhash"; exit 1; fi
          /usr/bin/xcrun stapler validate "$A"
          aspctl=$(/usr/sbin/spctl --assess --type execute -vvv "$A" 2>&1)
          echo "$aspctl"
          /usr/bin/grep -qF ': accepted' <<< "$aspctl" && /usr/bin/grep -qxF 'source=Notarized Developer ID' <<< "$aspctl" && /usr/bin/grep -qxF "origin=$ID" <<< "$aspctl" || { echo "::error::o Gatekeeper não aceita o .app como Notarized Developer ID"; exit 1; }
          [ "$(/usr/bin/lipo -archs "$A/Contents/MacOS/simplemd")" = arm64 ] || { echo "::error::o binário não é só arm64"; exit 1; }
          [ "$(/usr/bin/grep '^CDHash=' <<< "$info")" = "$(/usr/bin/codesign -dvvv "$RUNNER_TEMP/app/simpleMD.app" 2>&1 | /usr/bin/grep '^CDHash=')" ] || { echo "::error::o .app do .dmg não é o que foi assinado"; exit 1; }
          /usr/bin/hdiutil detach "$M" > /dev/null
          sha=$(/usr/bin/shasum -a 256 "$DMG" | /usr/bin/awk '{print $1}')
          echo "$sha  ${DMG##*/}"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - id: upload-dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/out/*.dmg
          archive: false
          retention-days: 1
          if-no-files-found: error

  # r6 (R-04, L-1, AS-R6-M16): exceção de escrita do caminho assinado (check:ci confere a forma
  # exata): só no push de tag v*, no Environment release, depois do sign-macos (que conferiu a
  # assinatura) e do bundle-windows. Sem checkout, sem código do repositório; baixa por id das saídas
  # dos jobs, confere o sha256 de cada um, lista exata, SHA256SUMS com nomes, atestação e rascunho.
  publish:
    needs: [bundle-windows, sign-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create (a tag já existe: --verify-tag)
      id-token: write # OIDC → certificado Sigstore da atestação
      attestations: write # grava a atestação
    steps:
      - name: Saídas dos jobs anteriores (dados, não código)
        env:
          DMG_ID: ${{ needs.sign-macos.outputs.signed-dmg-artifact-id }}
          DMG_SHA: ${{ needs.sign-macos.outputs.signed-dmg-sha256 }}
          EXE_ID: ${{ needs.bundle-windows.outputs.exe-artifact-id }}
          EXE_SHA: ${{ needs.bundle-windows.outputs.exe-sha256 }}
        run: |
          [[ "$DMG_ID" =~ ^[0-9]+$ ]] && [[ "$EXE_ID" =~ ^[0-9]+$ ]] || { echo "::error::id de artefato inválido"; exit 1; }
          [[ "$DMG_SHA" =~ ^[0-9a-f]{64}$ ]] && [[ "$EXE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sha256 inválido"; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.signed-dmg-artifact-id }}
          path: release/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.bundle-windows.outputs.exe-artifact-id }}
          path: release/windows
      - name: Lista exata, SHA256SUMS e notas
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DMG_SHA: ${{ needs.sign-macos.outputs.signed-dmg-sha256 }}
          EXE_SHA: ${{ needs.bundle-windows.outputs.exe-sha256 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          [[ "$DMG_SHA" =~ ^[0-9a-f]{64}$ ]] && [[ "$EXE_SHA" =~ ^[0-9a-f]{64}$ ]] && [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::saída ou variável inválida"; exit 1; }
          V="${TAG#v}"
          DMG="simpleMD_${V}_aarch64.dmg"
          EXE="simpleMD_${V}_x64-setup.exe"
          printf '%s\n' "release/macos/$DMG" "release/windows/$EXE" > "$RUNNER_TEMP/esperado"
          find release ! -type d | LC_ALL=C sort > "$RUNNER_TEMP/achado"
          diff -u "$RUNNER_TEMP/esperado" "$RUNNER_TEMP/achado" || { echo "::error::os artefatos não são exatamente o .dmg assinado e o -setup.exe de $TAG"; exit 1; }
          [ "$(sha256sum -- "release/macos/$DMG" | cut -d' ' -f1)" = "$DMG_SHA" ] || { echo "::error::o .dmg baixado não é o que o sign-macos conferiu"; exit 1; }
          [ "$(sha256sum -- "release/windows/$EXE" | cut -d' ' -f1)" = "$EXE_SHA" ] || { echo "::error::o -setup.exe baixado não é o que o bundle-windows conferiu"; exit 1; }
          mkdir assets
          mv -- "release/macos/$DMG" "release/windows/$EXE" assets/
          cd assets
          sha256sum -- "$DMG" "$EXE" > SHA256SUMS
          cat SHA256SUMS
          sums=$(sed 's/^/    /' SHA256SUMS)
          cat > "$RUNNER_TEMP/modelo.md" <<'NOTAS'
          > **macOS: assinado com Developer ID e notarizado pela Apple. Windows: ainda sem assinatura de código.** No macOS, a Apple conferiu este app e ele abre sem o bloqueio do Gatekeeper. No Windows, a Microsoft ainda não conferiu quem publicou o instalador: o SmartScreen avisa, e a conferência do passo 1 continua importante.

          **Única fonte oficial:** https://github.com/devrafaelbrauner/simpleMD/releases. Não baixe o simpleMD de outro lugar.

          ## Downloads

          | Sistema | Arquivo | Assinatura | Observação |
          |---|---|---|---|
          | macOS em Mac com Apple Silicon (M1 ou mais novo) | `simpleMD_@V@_aarch64.dmg` | Developer ID + notarização da Apple | Não roda em Mac com processador Intel |
          | Windows de 64 bits (x64) | `simpleMD_@V@_x64-setup.exe` | **Sem assinatura** | Instala só para o seu usuário, sem pedir senha de administrador |
          | (os dois) | `SHA256SUMS` | — | Somas SHA-256 dos dois arquivos |

          Não há atualização automática: para atualizar, baixe a nova versão desta página.

          ## 1. Confira o arquivo antes de abrir

          Baixe também o `SHA256SUMS` desta página, para a mesma pasta do instalador. Somas SHA-256 (iguais às do `SHA256SUMS`):

          @SUMS@

          - macOS (Terminal, na pasta dos arquivos baixados, por exemplo depois de `cd ~/Downloads`): o comando abaixo tem de imprimir `simpleMD_@V@_aarch64.dmg: OK`.

                shasum -a 256 -c --ignore-missing SHA256SUMS

          - Windows (PowerShell, na pasta dos arquivos baixados, por exemplo depois de `cd "$env:USERPROFILE\Downloads"`): o comando abaixo tem de imprimir `True`.

                (Get-FileHash .\simpleMD_@V@_x64-setup.exe -Algorithm SHA256).Hash -eq ((Select-String -SimpleMatch 'simpleMD_@V@_x64-setup.exe' .\SHA256SUMS).Line -split '\s+')[0]

          Qualquer outra saída (`FAILED`, `False`, uma mensagem de erro ou nada) quer dizer que o arquivo não confere.

          Opcional, mais forte (com o GitHub CLI autenticado, depois de `gh auth login`): confere que o arquivo foi gerado pelo workflow de release deste repositório, na tag @TAG@. Use o `.dmg` ou o `-setup.exe` no lugar de `<arquivo>` (o `SHA256SUMS` não tem atestação própria: ele é conferido pelo passo acima). Rodado num terminal, o comando tem de mostrar `✓ Verification succeeded!`:

              gh attestation verify <arquivo> --repo devrafaelbrauner/simpleMD --signer-workflow devrafaelbrauner/simpleMD/.github/workflows/release.yml --source-ref refs/tags/@TAG@ --deny-self-hosted-runners

          Opcional, macOS, depois de instalar (Terminal): o comando abaixo tem de mostrar `accepted`, `source=Notarized Developer ID` e `origin=Developer ID Application: Rafael Brauner (@TEAM@)`.

              spctl -a -vv /Applications/simpleMD.app

          **Se a soma não bater, se a atestação falhar ou se o macOS disser que não pôde verificar o app, que ele está "danificado" ou mandar você a "Privacidade e Segurança": não abra, apague o arquivo e avise de forma privada (https://github.com/devrafaelbrauner/simpleMD/security/policy).** Não tente contornar.

          ## 2. macOS: instalar

          - Abra o `.dmg` e, na janela dele, arraste o ícone simpleMD para o atalho "Applications" (é a pasta Aplicativos). Abra o simpleMD em Aplicativos.
          - Na primeira vez, o macOS pode perguntar se você quer abrir um app baixado da Internet; confirme a abertura. Isso acontece uma vez só. Nesta versão o macOS não deve bloquear o app nem pedir que você vá a "Privacidade e Segurança"; se isso acontecer, pare (passo 1).
          - **Primeira impressão:** no primeiro ⌘P, o macOS pode perguntar se o simpleMD pode buscar dispositivos em redes locais. O simpleMD só precisa disso para imprimir numa impressora de rede; se você não usa uma, não permita.

          ## 3. macOS: atualizar da 0.1.0

          - Feche o simpleMD (⌘Q). Abra o `.dmg` da @V@ e arraste o simpleMD para "Applications"; quando o Finder perguntar, substitua o app que já está lá. Suas notas e configurações continuam onde estavam.
          - Abra o simpleMD. A liberação que você fez na 0.1.0 em "Privacidade e Segurança" não é mais necessária.
          - Na primeira vez que você usar a IA nesta versão, o macOS pede **uma última vez** acesso a cada chave de IA guardada. Permita **só** se o pedido aparecer logo depois de você usar a IA no simpleMD @V@, escolhendo a opção de permitir sempre. Em qualquer outro momento, clique em **Negar**.

          ## 4. Windows: instalar ou atualizar da 0.1.0

          - Ao abrir o instalador, o SmartScreen pode mostrar "O Windows protegeu o computador", com só o botão "Não executar". Clique em "Mais informações", confira que aparecem "Aplicativo: simpleMD_@V@_x64-setup.exe" e "Fornecedor: Fornecedor desconhecido" (esperado: o instalador do Windows não tem assinatura) e só então clique em "Executar assim mesmo". O instalador (em inglês) instala o app em `%LOCALAPPDATA%\simpleMD`, só para o seu usuário e sem pedir administrador. Na última página, "Create desktop shortcut" (atalho na Área de Trabalho) e "Run simpleMD" (abrir o app ao terminar) vêm marcados; desmarque o que não quiser antes de clicar em "Finish". Se o Controle Inteligente de Aplicativos (Smart App Control) estiver ligado, o Windows bloqueia esta versão sem opção de exceção: **não o desligue**; aguarde a versão assinada do Windows.
          - Para atualizar da 0.1.0, feche o simpleMD e rode o instalador da @V@ (mesmos avisos). As configurações e as suas notas continuam.
          - O simpleMD usa o WebView2 da Microsoft. Ele já vem no Windows 11 e na maioria dos Windows 10; se faltar, o instalador o baixa da Microsoft (precisa de internet).

          ## 5. Chaves de IA guardadas

          - **macOS:** as chaves ficam nas Chaves (Keychain) do macOS. A partir desta versão o app é assinado: depois da permissão única do item 3, as próximas versões assinadas não devem pedir de novo (ainda não confirmado entre duas versões assinadas publicadas).
          - **Windows:** as chaves ficam no Gerenciador de Credenciais, ligadas à sua conta do Windows. Qualquer programa que você execute com a sua conta consegue lê-las sem perguntar. Mais um motivo para só executar programas cuja origem você conferiu.
          - Desinstalar o app **não** apaga as chaves: use "Remover chave" em Configurações → IA antes de desinstalar.

          ## 6. Desinstalar

          - **macOS:** arraste o simpleMD de Aplicativos para o Lixo. Para apagar também os dados internos do app, apague estes itens: `~/Library/Application Support/io.github.devrafaelbrauner.simplemd`, `~/Library/WebKit/io.github.devrafaelbrauner.simplemd`, `~/Library/Caches/io.github.devrafaelbrauner.simplemd` e `~/Library/Preferences/io.github.devrafaelbrauner.simplemd.plist`.
